databases:
  - name: medikiosk-db
    databaseName: medikiosk_db
    user: medikiosk
    plan: free

services:
  # Backend API Server
  - type: web
    name: medikiosk-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python db_init.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medikiosk-db
          property: connectionString

  # Frontend Web App
  - type: web
    name: medikiosk-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: medikiosk-backend
          property: host
